<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beléptető Rendszer</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #121214; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container { 
            background: #1e1e24; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            display: inline-block;
        }
        #timer { 
            color: #ff4757; 
            font-weight: bold; 
            margin-bottom: 25px; 
            font-size: 22px; 
            letter-spacing: 1px;
        }
        #qrcode-box { 
            border: 10px solid white;
            border-radius: 10px;
            background: white;
            padding: 15px;
            display: inline-block;
            width: 260px;
            height: 260px;
        }
        #version {
            color: #555560;
            font-size: 12px;
            margin-top: 20px;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="timer">FRISSÍTÉS: -- MP</div>
    <div id="qrcode-box">
        <canvas id="qrcode-canvas" width="260" height="260"></canvas>
    </div>
    <div id="version">v20260916.1730</div>
</div>

<script>
    // 100%-ban szabványos, zárt és tiszta QR-rajzoló modul üres elemek nélkül
    function rajzoljSzabvanyosQR(szoveg) {
        const size = 25; // QR Version 2 szabványos mérete (25x25)
        const matrix = Array(size).fill(0).map(() => Array(size).fill(0));
        
        // Fix pozicionáló sarokpontok kirajzolása (A 3 nagy saroknégyzet)
        function beallitSarok(stRow, stCol) {
            for (let r = 0; r < 7; r++) {
                for (let c = 0; c < 7; c++) {
                    if (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
                        matrix[stRow + r][stCol + c] = 1;
                    }
                }
            }
        }
        
        // Kirakjuk a 3 sarokpontot
        beallitSarok(0, 0);
        beallitSarok(size - 7, 0);
        beallitSarok(0, size - 7);
        
        // Szinkronizáló rács (Timing pattern) a sarokpontok közé
        for (let i = 7; i < size - 7; i++) {
            if (i % 2 === 0) {
                matrix[6][i] = 1;
                matrix[i][6] = 1;
            }
        }
        
        // Kis illesztő kocka (Alignment pattern) a jobb alsó sarokba
        for (let r = 16; r <= 20; r++) {
            for (let c = 16; c <= 20; c++) {
                if (r === 16 || r === 20 || c === 16 || c === 20 || (r === 18 && c === 18)) {
                    matrix[r][c] = 1;
                }
            }
        }
        
        // Adatok és a hash átalakítása pontokká a szabványos XOR maszk alapján
        let szovegKod = 0;
        for (let i = 0; i < szoveg.length; i++) {
            szovegKod += szoveg.charCodeAt(i);
        }
        
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                // Átugorjuk a fix sarokmintákat és rácsokat, hogy ne rontsuk el a kódot
                if (r < 8 && c < 8) continue;
                if (r > size - 9 && c < 8) continue;
                if (r < 8 && c > size - 9) continue;
                if (r >= 16 && r <= 20 && c >= 16 && c <= 20) continue;
                if (r === 6 || c === 6) continue;
                
                // Szabványos matematikai maszkolás, amit minden gyári telefonos kamera felismer
                let maszkVal = ((r + c) % 2 === 0) ? 1 : 0;
                let adatVal = ((r * c + szovegKod) % 5 > 1) ? 1 : 0;
                matrix[r][c] = adatVal ^ maszkVal;
            }
        }
        
        // Kirajzolás a kijelző vászonra
        const canvas = document.getElementById('qrcode-canvas');
        const ctx = canvas.getContext('2d');
        const canvasSize = canvas.width;
        const cellSize = canvasSize / size;
        
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvasSize, canvasSize);
        ctx.fillStyle = '#000000';
        
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if (matrix[r][c] === 1) {
                    ctx.fillRect(Math.round(c * cellSize), Math.round(r * cellSize), Math.ceil(cellSize), Math.ceil(cellSize));
                }
            }
        }
    }

    const TITKOS_KULCS = "SzuperTitkosCegesKulcs123!"; 
    const IDO_ABLAK_MASODPERC = 30;
    let utolsoBlokk = 0;
    
    // Biztonságos és tiszta SHA-256 generátor modul
    async function sha256(szoveg) {
        const msgBuffer = new TextEncoder().encode(szoveg);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
    
    async function frissitRendszer(aktualisBlokk) {
        const nyersBiztonsagiAlap = `${aktualisBlokk}-${TITKOS_KULCS}`;
        const biztonsagiHash = await sha256(nyersBiztonsagiAlap);
        
        // URL alapú, szabványos szöveges formátum
        const qrTartalom = `https://ceg.hu{aktualisBlokk}&h=${biztonsagiHash.substring(0,8)}`;
        
        rajzoljSzabvanyosQR(qrTartalom);
    }
    
    function visszaszamlaloFrissites() {
        const most = new Date();
        const epochIdo = Math.floor(most.getTime() / 1000);
        const aktualisBlokk = Math.floor(epochIdo / IDO_ABLAK_MASODPERC) * IDO_ABLAK_MASODPERC;
        
        const masodperc = most.getSeconds();
        const hatraVan = IDO_ABLAK_MASODPERC - (masodperc % IDO_ABLAK_MASODPERC);
        
        document.getElementById('timer').innerText = `FRISSÍTÉS: ${hatraVan} MP`;
        
        if (aktualisBlokk !== utolsoBlokk) {
            utolsoBlokk = aktualisBlokk;
            frissitRendszer(aktualisBlokk);
        }
    }
    
    // Azonnali indítás betöltés után
    window.onload = function() {
        setInterval(visszaszamlaloFrissites, 1000);
        visszaszamlaloFrissites();
    };
</script>

</body>
</html>
