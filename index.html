<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beléptető Rendszer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #121214; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container { 
            background: #1e1e24; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            display: inline-block;
        }
        #timer { 
            color: #ff4757; 
            font-weight: bold; 
            margin-bottom: 25px; 
            font-size: 22px; 
            letter-spacing: 1px;
        }
        #qrcode-box { 
            border: 10px solid white;
            border-radius: 10px;
            background: white;
            padding: 15px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 260px;
            height: 260px;
        }
        #version {
            color: #555560;
            font-size: 12px;
            margin-top: 20px;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="timer">FRISSÍTÉS: -- MP</div>
    <div id="qrcode-box"></div>
    <div id="version">v20260916.1649</div>
</div>

<script>
    // A kulcs Base64-kódolva szerepel, hogy Ctrl+U-val ránézve ne legyen
    // azonnal, nyílt szövegként olvasható. FIGYELEM: ez nem valódi
    // titkosítás, csak elrejti a kulcsot a felületes rátekintés elől.
    const TITKOS_KULCS_B64 = "U3p1cGVyVGl0a29zQ2VnZXNLdWxjczEyMyE=";
    const TITKOS_KULCS = atob(TITKOS_KULCS_B64);
    const FIX_SZOVEG = "KapCarKsz";
    const IDO_ABLAK_MASODPERC = 30;
    let utolsoBlokk = 0;
    let qrObjektum = null;

    // Valódi HMAC-SHA256 számítás a Web Crypto API-val.
    // Ehhez ismerni kell a TITKOS_KULCS pontos értékét, fejben vagy
    // egyszerű szorzással nem reprodukálható.
    async function hmacSha256(kulcs, uzenet) {
        const encoder = new TextEncoder();
        const key = await crypto.subtle.importKey(
            'raw',
            encoder.encode(kulcs),
            { name: 'HMAC', hash: 'SHA-256' },
            false,
            ['sign']
        );
        const alairas = await crypto.subtle.sign('HMAC', key, encoder.encode(uzenet));
        const byteTomb = Array.from(new Uint8Array(alairas));
        return byteTomb.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Valódi, szabványos, minden telefonos kamera/olvasó által beolvasható
    // QR-kód rajzolása a qrcodejs könyvtárral
    function rajzoljSzabvanyosQR(szoveg) {
        const box = document.getElementById('qrcode-box');
        if (!qrObjektum) {
            box.innerHTML = "";
            qrObjektum = new QRCode(box, {
                text: szoveg,
                width: 230,
                height: 230,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        } else {
            qrObjektum.clear();
            qrObjektum.makeCode(szoveg);
        }
    }

    // Dátum + idő + dinamikus, HMAC-SHA256 alapú ellenőrzőkód összeállítása
    async function frissitRendszer(most) {
        const ev = most.getFullYear();
        const honap = String(most.getMonth() + 1).padStart(2, '0');
        const nap = String(most.getDate()).padStart(2, '0');
        const ora = most.getHours();
        const perc = most.getMinutes();
        const masodperc = Math.floor(most.getSeconds() / IDO_ABLAK_MASODPERC) * IDO_ABLAK_MASODPERC;

        const datumSzoveg = `${ev}.${honap}.${nap}.`;
        const idoSzoveg = `${String(ora).padStart(2, '0')}:${String(perc).padStart(2, '0')}`;

        // Az üzenet, amit aláírunk: dátum-idő blokk + fix szöveg (belső só)
        const datumSzam = ev * 10000 + (most.getMonth() + 1) * 100 + most.getDate();
        const idoSzam = ora * 10000 + perc * 100 + masodperc;
        const uzenet = `${datumSzam}-${idoSzam}-${FIX_SZOVEG}`;

        // A HMAC-SHA256 hash első 8 karaktere lesz az ellenőrzőkód
        const hash = await hmacSha256(TITKOS_KULCS, uzenet);
        const ellenorzoKod = hash.substring(0, 8);

        const qrTartalom = `${datumSzoveg} ${idoSzoveg} ${ellenorzoKod}`;

        rajzoljSzabvanyosQR(qrTartalom);
    }
    
    function visszaszamlaloFrissites() {
        const most = new Date();
        const epochIdo = Math.floor(most.getTime() / 1000);
        const aktualisBlokk = Math.floor(epochIdo / IDO_ABLAK_MASODPERC) * IDO_ABLAK_MASODPERC;
        
        const masodperc = most.getSeconds();
        const hatraVan = IDO_ABLAK_MASODPERC - (masodperc % IDO_ABLAK_MASODPERC);
        
        document.getElementById('timer').innerText = `FRISSÍTÉS: ${hatraVan} MP`;
        
        if (aktualisBlokk !== utolsoBlokk) {
            utolsoBlokk = aktualisBlokk;
            frissitRendszer(most);
        }
    }
    
    window.onload = function() {
        setInterval(visszaszamlaloFrissites, 1000);
        visszaszamlaloFrissites();
    };
</script>

</body>
</html>
